global:
  imagePullSecrets:
    - name: "ces-container-registries"
# Optional override for the resource base name. By default, resources use
# "<release-name>-<chart-name>" (for example "lop-idp-ldap").
fullnameOverride: ""
replicas: 1
image:
  registry: registry.cloudogu.com
  repository: official/ldap
  tag: 2.6.10-5
imagePullPolicy: IfNotPresent
extraLabels: {}
service:
  port: 389
networkPolicies:
  enabled: true
  consumers:
    cas:
      enabled: true
      matchLabels:
        app.kubernetes.io/instance: lop-idp
        app.kubernetes.io/name: cas
    usermgt:
      enabled: true
      matchLabels:
        app.kubernetes.io/instance: lop-idp
        app.kubernetes.io/name: usermgt
    ldapMapper:
      enabled: true
      matchLabels:
        app.kubernetes.io/instance: lop-idp
        app.kubernetes.io/name: ldap-mapper
config:
  # Component configuration keys aligned with dogu.json (excluding container_config/*).
  password_change:
    notification_enabled: "true"
    check_interval_minutes: "1"
    mail_sender_address: ""
    mail_sender_name: ""
    mail_subject: ""
    mail_text: ""
  logging:
    root: "INFO"
  user_search_size_limit: "4000"
  max_db_size: "104857600"
  admin_username: "admin"
  admin_member: "false"
  admin_givenname: "admin"
  admin_surname: "admin"
  admin_displayname: "admin"
  admin_mail: ""
  openldap_suffix: "dc=cloudogu,dc=com"
globalConfig:
  configMapName: "global-config"
  key: "config.yaml"
secrets:
  # Initial password for the LDAP admin user under ou=People.
  # This value is only used during first initialization of the LDAP data.
  initialAdminPasswordSecretRef:
    create: true
    name: ""
    passwordKey: password
  serviceAccounts:
    # For strict GitOps/ArgoCD setups without Helm lookup support, set create=false and
    # provide externally managed Secrets with the configured name and keys.
    cas:
      enabled: true
      secret:
        create: true
        name: "ldap-cas-sa"
        usernameKey: username
        passwordKey: password
    usermgt:
      enabled: true
      secret:
        create: true
        name: "ldap-usermgt-sa"
        usernameKey: username
        passwordKey: password
    ldapMapper:
      enabled: true
      secret:
        create: true
        name: "ldap-ldap-mapper-sa"
        usernameKey: username
        passwordKey: password
persistence:
  size: 1Gi
  storageClassName: ""
  resize:
    enabled: true
    hook:
      image:
        repository: docker.io/alpine/kubectl
        tag: "1.35.3"
        pullPolicy: IfNotPresent
      backoffLimit: 0
podSecurityContext:
  fsGroup: 101
securityContext:
  runAsUser: 100
  runAsGroup: 101
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 256Mi
nodeSelector: {}
affinity: {}
tolerations: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
migration:
  enabled: true
  hook:
    image:
      repository: docker.io/alpine/kubectl
      tag: "1.35.3"
      pullPolicy: IfNotPresent
    waitTimeoutSeconds: 300
    backoffLimit: 0
