apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ldap.fullname" . }}-config
  labels:
    {{- include "ldap.labels" . | nindent 4 }}
data:
  config.yaml: |-
{{- $normalConfig := omit .Values.config "runtimeMode" "domain" }}
{{ include "ldap.expandSlashKeys" (list $normalConfig) | indent 4 }}
