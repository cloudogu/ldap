apiVersion: v1
kind: Service
metadata:
  name: {{ include "ldap.fullname" . }}
  labels:
    {{- include "ldap.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ldap.selectorLabels" . | nindent 4 }}
  ports:
    - name: ldap
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: ldap
