apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ldap.fullname" . }}
  labels:
    {{- include "ldap.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ldap.fullname" . }}
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "ldap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ldap.labels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-persistence-layout
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /persistence/db /persistence/config
              chown -R 100:101 /persistence/db /persistence/config
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /persistence
      containers:
        - name: ldap
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: LDAP_RUNTIME_MODE
              value: {{ quote .Values.config.runtimeMode }}
            - name: LDAP_DOMAIN
              value: {{ quote .Values.config.domain }}
            - name: OPENLDAP_SUFFIX
              value: {{ quote .Values.config.suffix }}
          ports:
            - name: ldap
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/openldap
              subPath: db
            - name: data
              mountPath: /etc/openldap/slapd.d
              subPath: config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "ldap.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
