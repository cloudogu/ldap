apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ldap.fullname" . }}
  labels:
    {{- include "ldap.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ldap.fullname" . }}
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "ldap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ldap.labels" . | nindent 8 }}
      annotations:
        checksum/component-config: {{ include (print $.Template.BasePath "/component-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-persistence-layout
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /persistence/db /persistence/config /persistence/local-config
              if ! chown -R 100:101 /persistence/db /persistence/config /persistence/local-config 2>/dev/null; then
                chmod -R 0777 /persistence/db /persistence/config /persistence/local-config || true
              fi

              # Copy immutable image content to a writable volume for non-root runtime.
              cp -a /etc/openldap/. /openldap-etc/
              chmod -R 0777 /openldap-etc

              DOGU_VERSION="$(sed -n 's/.*\"Version\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p' /dogu.json | head -n1)"
              if [ -z "${DOGU_VERSION}" ]; then
                echo "unable to determine dogu version from /dogu.json" >&2
                exit 1
              fi

              HOST_DOGU_DIR="/ces-dogu-json/${HOSTNAME}"
              mkdir -p "${HOST_DOGU_DIR}"
              printf '%s' "${DOGU_VERSION}" > "${HOST_DOGU_DIR}/current"
              cp /dogu.json "${HOST_DOGU_DIR}/${DOGU_VERSION}"
              chown -R 100:101 /ces-dogu-json 2>/dev/null || true
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - FOWNER
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /persistence
            - name: openldap-etc
              mountPath: /openldap-etc
            - name: ces-dogu-json
              mountPath: /ces-dogu-json
      containers:
        - name: ldap
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: ECOSYSTEM_MULTINODE
              value: "true"
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "values.secrets.adminCredentialsSecretRef.name is required" .Values.secrets.adminCredentialsSecretRef.name | quote }}
                  key: {{ required "values.secrets.adminCredentialsSecretRef.passwordKey is required" .Values.secrets.adminCredentialsSecretRef.passwordKey | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: ldap
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/openldap
              subPath: db
            - name: openldap-etc
              mountPath: /etc/openldap
            - name: data
              mountPath: /etc/openldap/slapd.d
              subPath: config
            - name: data
              mountPath: /var/ces/config
              subPath: local-config
            - name: ces-config
              mountPath: /etc/ces/config
              readOnly: true
            - name: ces-dogu-json
              mountPath: /etc/ces/dogu_json
              readOnly: true
            - name: ces-state
              mountPath: /var/ces/state
      volumes:
        - name: openldap-etc
          emptyDir: {}
        - name: ces-config
          projected:
            sources:
              - configMap:
                  name: {{ .Values.globalConfig.configMapName | quote }}
                  items:
                    - key: {{ .Values.globalConfig.key | quote }}
                      path: global/config.yaml
              - configMap:
                  name: {{ include "ldap.fullname" . }}-config
                  items:
                    - key: config.yaml
                      path: normal/config.yaml
                    - key: sensitive-config.yaml
                      path: sensitive/config.yaml
        - name: ces-dogu-json
          emptyDir: { }
        - name: ces-state
          emptyDir: { }
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "ldap.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
