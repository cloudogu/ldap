{{- $secretCfg := .Values.secrets.initialAdminPasswordSecretRef -}}
{{- if $secretCfg.create }}
{{- $secretName := include "ldap.initialAdminPasswordSecretName" . -}}
{{- $passwordKey := default "password" $secretCfg.passwordKey -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingPassword := dict "value" "" -}}
{{- if and $existingSecret $existingSecret.data -}}
{{- with (index $existingSecret.data $passwordKey) }}{{- $_ := set $existingPassword "value" (. | b64dec) -}}{{- end -}}
{{- end -}}
{{- $password := default (randAlphaNum 40) (index $existingPassword "value") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ldap.labels" . | nindent 4 }}
    {{- include "ldap.backupLabels" . | nindent 4 }}
type: Opaque
data:
  {{ $passwordKey | quote }}: {{ $password | b64enc | quote }}
{{- end }}
