{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ldap.fullname" . }}-deny-all
  labels:
    {{- include "ldap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ldap.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
---
{{- if .Values.networkPolicies.consumers.cas.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ldap.fullname" . }}-dependency-cas
  labels:
    {{- include "ldap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ldap.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.consumers.cas.matchLabels | nindent 14 }}
---
{{- end }}
{{- if .Values.networkPolicies.consumers.usermgt.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ldap.fullname" . }}-dependency-usermgt
  labels:
    {{- include "ldap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ldap.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.consumers.usermgt.matchLabels | nindent 14 }}
---
{{- end }}
{{- if .Values.networkPolicies.consumers.ldapMapper.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ldap.fullname" . }}-dependency-ldap-mapper
  labels:
    {{- include "ldap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ldap.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.consumers.ldapMapper.matchLabels | nindent 14 }}
{{- end }}
{{- end }}
